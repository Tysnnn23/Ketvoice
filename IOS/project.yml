name: Ketvoice
options:
  developmentLanguage: fr
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.ketvoice.ios
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_LANGUAGE: fr
    MARKETING_VERSION: "3.0.7"
    CURRENT_PROJECT_VERSION: "32"
    KETVOICE_API_URL: https://xodklrunqlzyeiqtovgx.supabase.co
    KETVOICE_PUBLISHABLE_KEY: ""
targets:
  Ketvoice:
    type: application
    platform: iOS
    sources:
      - path: Ketvoice
        excludes: [Info.plist]
      - path: Resources
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Ketvoice/Info.plist
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
schemes:
  Ketvoice:
    build:
      targets:
        Ketvoice: all
