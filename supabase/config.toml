# Preserve the existing public listener broker's deployed gateway configuration.
[functions.ketvoice-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/ketvoice-api/index.ts"

[functions.ketvoice-content]
enabled = true
verify_jwt = true
entrypoint = "./functions/ketvoice-content/index.ts"

[functions.ketvoice-artists]
enabled = true
verify_jwt = true
import_map = "./functions/ketvoice-artists/deno.json"
entrypoint = "./functions/ketvoice-artists/index.ts"

# Windows 2.0 Connexions: QR sign-in, remote sign-out, Last.fm, "Mes donnees". All keep gateway JWT verification
# (device-link's /start and /poll are called with the public anon key).
[functions.device-link]
enabled = true
verify_jwt = true
entrypoint = "./functions/device-link/index.ts"

[functions.devices]
enabled = true
verify_jwt = true
entrypoint = "./functions/devices/index.ts"

[functions.lastfm]
enabled = true
verify_jwt = true
entrypoint = "./functions/lastfm/index.ts"

[functions.my-data]
enabled = true
verify_jwt = true
entrypoint = "./functions/my-data/index.ts"

# Profile photos and banners (Windows 2.0 social): public pictures are fetched without any header by link previews
# and <img>; the handler treats a request without a listener's token as anonymous (public profiles only).
[functions.ketvoice-profile]
enabled = true
verify_jwt = false
entrypoint = "./functions/ketvoice-profile/index.ts"
