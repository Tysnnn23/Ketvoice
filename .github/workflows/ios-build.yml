name: iOS source build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: ["main", "ios-port-*"]
    paths:
      - "IOS/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check resources shared with Android
        run: python3 IOS/tools/sync_android_resources.py --check
      - name: Check packaging safeguards (fixtures, not device tests)
        run: python3 -m unittest discover -s IOS/tools -p 'test_*.py'
      - name: Test shared Swift models (no simulator launch)
        run: swift test --package-path IOS
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec IOS/project.yml
      - name: Compile for iPhone (unsigned; not installable)
        run: |
          xcodebuild -project IOS/Ketvoice.xcodeproj -scheme Ketvoice -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath IOS/.build/iphone CODE_SIGNING_ALLOWED=NO build
      - name: Compile for Simulator (no emulator launch)
        run: |
          xcodebuild -project IOS/Ketvoice.xcodeproj -scheme Ketvoice -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath IOS/.build/simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - name: Classify binary scan findings without disclosing matched values
        run: |
          python3 IOS/tools/audit_binary_strings.py IOS/.build/iphone/Build/Products/Release-iphoneos/Ketvoice.app/Ketvoice --output IOS/.build/artifacts/binary-pattern-audit.json
      - name: Package unsigned IPA for local re-signing
        run: |
          python3 tools/scan_release.py IOS/Ketvoice IOS/Resources
          python3 IOS/tools/scan_ios_bundle.py IOS/.build/iphone/Build/Products/Release-iphoneos/Ketvoice.app
          python3 IOS/tools/package_unsigned.py IOS/.build/iphone/Build/Products/Release-iphoneos/Ketvoice.app IOS/.build/artifacts/Ketvoice-unsigned.ipa
          python3 IOS/tools/verify_ipa.py IOS/.build/artifacts/Ketvoice-unsigned.ipa IOS/.build/artifacts/Ketvoice-unsigned.validation.json --source-commit "$GITHUB_SHA" > IOS/.build/artifacts/ipa-structure-verification.json
      - name: Render on iPhone simulator (optional diagnostic, not physical validation)
        id: render
        continue-on-error: true
        timeout-minutes: 7
        run: |
          python3 IOS/tools/render_simulator.py IOS/.build/simulator/Build/Products/Debug-iphonesimulator/Ketvoice.app IOS/.build/artifacts
      - name: Record simulator diagnostic outcome separately
        if: always()
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python3 -c 'import json,os,pathlib; p=pathlib.Path("IOS/.build/artifacts"); p.mkdir(parents=True,exist_ok=True); (p/"simulator-step-outcome.json").write_text(json.dumps({"outcome":os.environ["RENDER_OUTCOME"],"required_for_packaging":False,"physical_device":False},indent=2)+"\n")'
          echo "iPhone simulator diagnostic: $RENDER_OUTCOME (not a physical-device test)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ketvoice-iPhone-UNSIGNED-not-installable
          path: IOS/.build/artifacts/*
          retention-days: 7
          if-no-files-found: ignore
