name: Windows

# Ketvoice for Windows (desktop/): tests, MSI, a silent install, the installed app's smoke run,
# uninstall. The Android workflow (android.yml) is separate and unchanged.
on:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/kotlin/**"
      - "app/src/test/kotlin/**"
      - "app/src/main/assets/translations.json"
      - "native/**"
      - "docs/licenses/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX found: $((Get-Command candle.exe).Source)"
          } else {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
            if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }

      # System Media Transport Controls: a small C++/WinRT DLL packaged into the app's resources.
      - name: SMTC DLL (native/smtc, MSVC + C++/WinRT)
        run: |
          cmake -S native/smtc -B native/smtc/build -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build native/smtc/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          $dll = "native/smtc/build/Release/ketvoice_smtc.dll"
          if (-not (Test-Path $dll)) { throw "ketvoice_smtc.dll was not built" }
          "ketvoice_smtc.dll: $((Get-Item $dll).Length) bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Desktop tests
        run: ./gradlew -p desktop --no-daemon test -PrequireSmtc=true

      - name: Test report
        if: always()
        run: |
          $xml = Get-ChildItem desktop/build/test-results/test -Filter *.xml -ErrorAction SilentlyContinue
          $t = 0; $f = 0
          foreach ($x in $xml) { $s = ([xml](Get-Content $x.FullName)).testsuite; $t += [int]$s.tests; $f += [int]$s.failures + [int]$s.errors }
          "Desktop tests: $t run, $f failed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Package MSI
        run: ./gradlew -p desktop --no-daemon packageMsi -PrequireSmtc=true

      - name: Install, smoke, uninstall
        run: |
          $msi = Get-ChildItem desktop/build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was built" }
          Write-Host "MSI: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 1)) MB)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec install exit $($p.ExitCode)" }

          $roots = @("$env:LOCALAPPDATA\Ketvoice", "$env:LOCALAPPDATA\Programs\Ketvoice", "$env:ProgramFiles\Ketvoice")
          $exe = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Recurse -Filter Ketvoice.exe } | Select-Object -First 1
          if (-not $exe) {
            Get-Content install.log | Select-String -Pattern "INSTALLDIR|APPLICATIONFOLDER" | Select-Object -First 10
            throw "Ketvoice.exe not found after install"
          }
          Write-Host "Installed: $($exe.FullName)"

          $run = Start-Process $exe.FullName -ArgumentList "--smoke" -Wait -PassThru
          $log = "$env:LOCALAPPDATA\Ketvoice\Data\smoke.log"
          if (Test-Path $log) { Get-Content $log | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          if ($run.ExitCode -ne 0) { throw "Ketvoice.exe --smoke exit $($run.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "^smtc (ok|skipped)" -Quiet)) { throw "--smoke printed no SMTC line" }
          if (-not (Select-String -Path $log -Pattern "^thumbbar ok" -Quiet)) { throw "--smoke printed no thumbnail toolbar line" }

          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
          if (Test-Path $exe.FullName) { throw "Ketvoice.exe still present after uninstall" }

      - uses: actions/upload-artifact@v4
        with:
          name: Ketvoice-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
