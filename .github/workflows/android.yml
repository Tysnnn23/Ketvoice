name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Ubuntu runners ship the Android SDK preinstalled; make sure the
          # platform/build-tools the app targets are present and accepted.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null \
            || "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Signing material for the "sideload" signingConfig, in priority order:
      #   1) KETVOICE_KEYSTORE_B64 secret — the STABLE project keystore (base64)
      #   2) fallback debug keystore generated on the fly (UNSTABLE — causes
      #      "app conflicts with an existing package" installs on devices)
      # Using the stable secret makes every APK installable over the previous
      # one, which is exactly what we want for our own sideload releases.
      - name: Provide signing keystore
        id: keystore
        env:
          KETVOICE_KEYSTORE_B64: ${{ secrets.KETVOICE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KETVOICE_KEYSTORE_B64" ]; then
            echo "Decoding stable release keystore from secret."
            printf '%s' "$KETVOICE_KEYSTORE_B64" | base64 -d > "$HOME/.android/ketvoice-release.jks"
            echo "KETVOICE_KEYSTORE=$HOME/.android/ketvoice-release.jks" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KETVOICE_KEYSTORE_B64 secret not set — falling back to a"
            echo "::warning::fresh debug keystore. APKs will NOT install over an"
            echo "::warning::existing build (signature mismatch). See docs/SIGNING.md."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile (assemble mobile + quest release)
        env:
          KETVOICE_STORE_PASSWORD: ${{ secrets.KETVOICE_STORE_PASSWORD }}
          KETVOICE_KEY_PASSWORD: ${{ secrets.KETVOICE_KEY_PASSWORD }}
          KETVOICE_KEY_ALIAS: ${{ secrets.KETVOICE_KEY_ALIAS }}
        run: ./gradlew :app:assembleMobileRelease :app:assembleQuestRelease --stacktrace

      - name: Unit tests (best effort)
        run: ./gradlew :app:testMobileReleaseUnitTest --stacktrace || true

      - name: Lint
        run: ./gradlew :app:lintMobileRelease --stacktrace || true

      - name: Upload APKs (unsigned build artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ketvoice-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APKs to GitHub Release (on tag)
        # Never publish APKs signed by the throwaway CI debug key: they cannot
        # install over an existing Ketvoice and show up as a package conflict.
        # Without the stable keystore the release simply keeps no APK asset.
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.stable == 'true'
        # softprops/action-gh-release occasionally returns a transient HttpError
        # while fetching the release ("Unexpected error fetching GitHub release").
        # The APKs are still uploaded as build artifacts above, so a failure here
        # must not turn the whole pipeline red.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/mobile/release/*.apk
            app/build/outputs/apk/quest/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
