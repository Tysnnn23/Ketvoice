name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Ubuntu runners ship the Android SDK preinstalled; make sure the
          # platform/build-tools the app targets are present and accepted.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null \
            || "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # The release build signs with a "sideload" config that falls back to the
      # debug keystore at ~/.android/debug.keystore. CI runners don't have it, so
      # generate one matching the alias/passwords the fallback expects.
      - name: Provide fallback debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compile (assemble mobile + quest release)
        run: ./gradlew :app:assembleMobileRelease :app:assembleQuestRelease --stacktrace

      - name: Unit tests (best effort)
        run: ./gradlew :app:testMobileReleaseUnitTest --stacktrace || true

      - name: Lint
        run: ./gradlew :app:lintMobileRelease --stacktrace || true

      - name: Upload APKs (unsigned build artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ketvoice-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APKs to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/mobile/release/*.apk
            app/build/outputs/apk/quest/release/*.apk
          fail_on_unmatched_files: false
