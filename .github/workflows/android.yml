name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Ubuntu runners ship the Android SDK preinstalled; make sure the
          # platform/build-tools the app targets are present and accepted.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null \
            || "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Signing material for the "sideload" signingConfig, in priority order:
      #   1) KETVOICE_KEYSTORE_B64 secret — the STABLE project keystore (base64)
      #   2) fallback debug keystore generated on the fly (UNSTABLE — causes
      #      "app conflicts with an existing package" installs on devices)
      # Using the stable secret makes every APK installable over the previous
      # one, which is exactly what we want for our own sideload releases.
      - name: Provide signing keystore
        id: keystore
        env:
          KETVOICE_KEYSTORE_B64: ${{ secrets.KETVOICE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KETVOICE_KEYSTORE_B64" ]; then
            echo "Decoding stable release keystore from secret."
            # Secrets are often copy-pasted with line wrapping; base64 -d stops
            # at the first invalid byte and silently yields a truncated store.
            if ! printf '%s' "$KETVOICE_KEYSTORE_B64" \
                 | tr -d '[:space:]' \
                 | base64 -d > "$HOME/.android/ketvoice-release.jks" 2>/dev/null; then
              echo "::error::KETVOICE_KEYSTORE_B64 is not valid base64."
              exit 1
            fi
            echo "KETVOICE_KEYSTORE=$HOME/.android/ketvoice-release.jks" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KETVOICE_KEYSTORE_B64 secret not set — falling back to a"
            echo "::warning::fresh debug keystore. APKs will NOT install over an"
            echo "::warning::existing build (signature mismatch). See docs/SIGNING.md."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail here, with an actionable message, instead of inside
      # `:app:packageQuestRelease`, where Keytool only reports
      # "DerInputStream.getLength(): lengthTag=109, too big" and the cause
      # (a corrupt secret) is invisible in the log.
      - name: Validate signing keystore
        if: steps.keystore.outputs.stable == 'true'
        env:
          KETVOICE_STORE_PASSWORD: ${{ secrets.KETVOICE_STORE_PASSWORD }}
          KETVOICE_KEY_ALIAS: ${{ secrets.KETVOICE_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.KETVOICE_CERT_SHA256 || 'ae25a19cee8ac781f30de4c933541257fdd46a6ea7fca6f7ab021f68221f37a9' }}
        run: |
          set -euo pipefail
          ks="${KETVOICE_KEYSTORE:-$HOME/.android/ketvoice-release.jks}"
          alias="${KETVOICE_KEY_ALIAS:-androiddebugkey}"
          storepass="${KETVOICE_STORE_PASSWORD:-android}"
          echo "keystore: $ks ($(stat -c %s "$ks") bytes), alias: $alias"
          if ! keytool -list -keystore "$ks" -storepass "$storepass" -alias "$alias" > /dev/null 2>"$RUNNER_TEMP/keytool.err"; then
            sed -n '1,20p' "$RUNNER_TEMP/keytool.err"
            echo "::error::KETVOICE_KEYSTORE_B64 does not decode into a keystore Keytool can read."
            echo "::error::Re-upload it with tools/push_secrets.py using the keystore that signs the published APKs. See docs/SIGNING.md."
            exit 1
          fi
          # apksigner reports the SHA-256 of the DER certificate, which is also
          # sha256sum of keytool -exportcert: the exact same value, but locale
          # independent (Keytool localises its fingerprint labels).
          cert_sha=$(keytool -exportcert -keystore "$ks" -storepass "$storepass" -alias "$alias" 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "keystore certificate SHA-256: $cert_sha"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$cert_sha" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate $cert_sha != expected $EXPECTED_CERT_SHA256."
            echo "::error::Either the secret holds the wrong keystore, or the pin must move to the new identity (breaks in-place updates)."
            exit 1
          fi

      - name: Compile (assemble mobile + quest release)
        env:
          KETVOICE_STORE_PASSWORD: ${{ secrets.KETVOICE_STORE_PASSWORD }}
          KETVOICE_KEY_PASSWORD: ${{ secrets.KETVOICE_KEY_PASSWORD }}
          KETVOICE_KEY_ALIAS: ${{ secrets.KETVOICE_KEY_ALIAS }}
        run: ./gradlew :app:assembleMobileRelease :app:assembleQuestRelease --stacktrace

      - name: Unit tests (Mobile and Quest)
        run: >-
          ./gradlew :app:testMobileDebugUnitTest :app:testQuestDebugUnitTest
          :app:testMobileReleaseUnitTest :app:testQuestReleaseUnitTest
          --stacktrace --max-workers=2

      # Fails when a user-facing string exists only in French. Strings that are
      # not user text belong in tools/ui-text-ignored.json with a reason.
      - name: Audit UI translations
        run: python3 tools/audit_ui_texts.py --check

      - name: Lint (Mobile and Quest)
        run: ./gradlew :app:lintMobileRelease :app:lintQuestRelease --stacktrace --max-workers=2

      # The keystore preflight proves the secret is readable; this proves the
      # APKs on disk really carry the release identity before anything is
      # attached to a release.
      - name: Verify APK signatures
        if: steps.keystore.outputs.stable == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.KETVOICE_CERT_SHA256 || 'ae25a19cee8ac781f30de4c933541257fdd46a6ea7fca6f7ab021f68221f37a9' }}
        run: |
          set -uo pipefail
          # Pick the newest apksigner that actually runs: a build-tools release
          # newer than the runner's JDK exits without printing anything.
          apksigner_bin=""
          while IFS= read -r candidate; do
            if "$candidate" version > /dev/null 2>&1; then
              apksigner_bin="$candidate"
              break
            fi
            echo "::warning::$candidate is not runnable on this JDK, trying an older one"
          done < <(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner -type f | sort -Vr)
          if [ -z "$apksigner_bin" ]; then
            echo "::error::No runnable apksigner under $ANDROID_HOME/build-tools."
            exit 1
          fi
          echo "apksigner: $apksigner_bin"
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')
          count=0
          status=0
          while IFS= read -r apk; do
            count=$((count + 1))
            out=$("$apksigner_bin" verify --print-certs "$apk" 2>&1 || true)
            # The certificate SHA-256 is the first 64-hex token in the report
            # (the SHA-1 and MD5 digests follow it). Parsing one token instead
            # of the label keeps this working across build-tools wordings.
            digest=$(printf '%s\n' "$out" | tr -d ':' | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-F' 'a-f')
            if [ -n "$digest" ] && [ "$digest" = "$expected" ]; then
              echo "ok   $apk -> $digest"
            else
              echo "--- apksigner report for $apk ---"
              printf '%s\n' "$out" | head -20
              echo "::error file=$apk::signed by ${digest:-unknown}, expected $expected"
              status=1
            fi
          done < <(find app/build/outputs/apk -name '*.apk' | sort)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK found to verify."
            status=1
          fi
          exit "$status"

      - name: Upload verified APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ketvoice-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # Release assets belong to tools/publish_release.py, after checksums and
      # validation metadata are staged. A tag rebuild must never mutate a public
      # release by appending unrecorded generic APKs.
