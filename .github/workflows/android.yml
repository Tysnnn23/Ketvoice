name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile & unit test
        run: ./gradlew :app:assembleMobileRelease :app:testMobileReleaseUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintMobileRelease --stacktrace || true

      - name: Upload APKs (unsigned build artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ketvoice-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APKs to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/mobile/release/*.apk
            app/build/outputs/apk/quest/release/*.apk
          fail_on_unmatched_files: false
