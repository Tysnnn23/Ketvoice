name: Generate Signed Keystore

# One-shot utility: generates a stable release keystore so every APK we build
# shares the SAME signature. This fixes the "app conflicts with an existing
# package" install error, which happens when CI re-generates a random debug
# keystore on every run.
#
# Run it once manually (Actions tab -> "Generate Signed Keystore" -> Run workflow).
# It prints the base64 keystore in the job summary. Commit that file under
# keystore/ketvoice-release.b64 OR paste it into the KETVOICE_KEYSTORE_B64 secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore (PKCS12, stable identity)
        id: gen
        run: |
          keytool -genkeypair -v \
            -keystore ketvoice-release.jks \
            -storetype JKS \
            -storepass "${{ secrets.KETVOICE_STORE_PASSWORD || 'ketvoice2026' }}" \
            -keypass  "${{ secrets.KETVOICE_KEY_PASSWORD   || 'ketvoice2026' }}" \
            -alias    "${{ secrets.KETVOICE_KEY_ALIAS      || 'ketvoice' }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Ketvoice, O=Ketvoice, C=FR"
          echo "-----BEGIN BASE64 KEYSTORE-----"
          base64 -w0 ketvoice-release.jks
          echo ""
          echo "-----END BASE64 KEYSTORE-----"
          echo "=== SHA-256 signing certificate ==="
          keytool -list -v -keystore ketvoice-release.jks \
            -storepass "${{ secrets.KETVOICE_STORE_PASSWORD || 'ketvoice2026' }}" \
            -alias "${{ secrets.KETVOICE_KEY_ALIAS || 'ketvoice' }}" 2>/dev/null \
          | grep -E "SHA256:|SHA1:" || true

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketvoice-release-keystore
          path: ketvoice-release.jks
          retention-days: 7
